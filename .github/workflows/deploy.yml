# CropGuard AI - CI/CD (Milestone 6)
# Every push to main: build -> push -> deploy to GKE -> health-check.
# If the rollout or the health check fails, the deployment is rolled back
# automatically and the pipeline verifies the previous version is serving.
name: Build, deploy & health-check

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  PROJECT_ID: cropguard-ai-509423
  REGION: us-central1
  CLUSTER: cropguard-cluster
  IMAGE: us-central1-docker.pkg.dev/cropguard-ai-509423/cropguard/cropguard-app
  APP_URL: https://136-68-161-188.sslip.io
  # Keyless auth (Workload Identity Federation) - created by infra/cicd.tf. Not secrets.
  WIF_PROVIDER: projects/387386737350/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOY_SA: cropguard-deployer@cropguard-ai-509423.iam.gserviceaccount.com

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Free runner disk space (TensorFlow + PyTorch image is ~6 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Fetch trained model from GCS (not stored in git)
        run: gcloud storage cp gs://${{ env.PROJECT_ID }}-artifacts/models/final_model.keras models/final_model.keras

      - name: Log in to Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ github.sha }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  deploy:
    name: Deploy, health-check, auto-rollback
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Record the version currently serving (rollback target)
        id: prev
        run: |
          PREV=$(kubectl get deployment cropguard -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "image=$PREV" >> "$GITHUB_OUTPUT"
          echo "Currently serving: $PREV"
          curl -s "$APP_URL/health"; echo

      - name: Deploy ${{ github.sha }}
        id: rollout
        continue-on-error: true   # let the rollback steps run if this fails
        run: |
          kubectl set image deployment/cropguard web=$IMAGE:$GITHUB_SHA
          kubectl annotate deployment/cropguard kubernetes.io/change-cause="github-actions ${GITHUB_SHA::7}" --overwrite
          # Fails if new pods never pass the readiness probe (/readyz) in time.
          # maxUnavailable: 0 keeps the old pods serving meanwhile.
          kubectl rollout status deployment/cropguard --timeout=360s

      - name: Health check (public HTTPS URL)
        id: health
        if: steps.rollout.outcome == 'success'
        continue-on-error: true
        run: |
          for i in $(seq 1 12); do
            READY=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/readyz")
            VERSION=$(curl -s "$APP_URL/health" | jq -r '.version // "none"')
            echo "attempt $i: /readyz=$READY  serving version=$VERSION"
            if [ "$READY" = "200" ] && [ "$VERSION" = "$GITHUB_SHA" ]; then
              echo "Healthy: $APP_URL is serving $GITHUB_SHA"; exit 0
            fi
            sleep 10
          done
          echo "::error::Health check failed for $GITHUB_SHA"; exit 1

      - name: Automatic rollback
        id: rollback
        if: steps.rollout.outcome != 'success' || steps.health.outcome != 'success'
        run: |
          echo "::warning::Deployment of ${GITHUB_SHA::7} failed (rollout=${{ steps.rollout.outcome }}, health=${{ steps.health.outcome }}). Rolling back."
          kubectl rollout undo deployment/cropguard
          kubectl rollout status deployment/cropguard --timeout=360s
          kubectl rollout history deployment/cropguard | tail -4

      - name: Verify the previous version is serving traffic
        if: steps.rollback.outcome == 'success'
        run: |
          NOW=$(kubectl get deployment cropguard -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "Deployment image after rollback: $NOW"
          echo "Expected (previous):            ${{ steps.prev.outputs.image }}"
          [ "$NOW" = "${{ steps.prev.outputs.image }}" ] || { echo "::error::Rollback did not restore the previous image"; exit 1; }
          for i in $(seq 1 12); do
            READY=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/readyz")
            echo "attempt $i: /readyz=$READY  /health=$(curl -s "$APP_URL/health")"
            [ "$READY" = "200" ] && break
            sleep 10
          done
          [ "$READY" = "200" ] || { echo "::error::Previous version is not healthy"; exit 1; }
          echo "::error::Release ${GITHUB_SHA::7} was rolled back automatically; previous version is serving traffic."
          exit 1   # mark the run as failed: the new release did not ship
