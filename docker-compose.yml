services:
  web:
    build: .
    image: us-central1-docker.pkg.dev/cropguard-ai-509423/cropguard/cropguard-app:v1
    container_name: cropguard
    ports:
      - "5000:5000"               # host:container - same port as Milestone 2
    env_file:
      - .env                      # secrets injected at runtime, never baked into the image
    environment:
      FLASK_DEBUG: "false"
    volumes:
      - sqlite_data:/app/instance            # SQLite database survives container restarts
      - uploads:/app/static/uploads          # uploaded leaf images
      - model_cache:/home/appuser/.cache     # HuggingFace model download cache
      - u2net_cache:/home/appuser/.u2net     # rembg background-removal model cache
    networks:
      - cropguard-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/login')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  sqlite_data:
  uploads:
  model_cache:
  u2net_cache:

networks:
  cropguard-net:
