services:
  web:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./static/uploads:/app/static/uploads   # local-dev bind mount; replaced by GCS in Step 7
      - sqlite_data:/app/instance               # persists site.db across container restarts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sqlite_data:
