# Kubernetes service account for the app pods. Workload Identity maps it to the
# Google service account cropguard-app-sa, so pods get Secret Manager, Cloud SQL
# and bucket access with short-lived tokens -- no key files.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cropguard-ksa
  annotations:
    iam.gke.io/gcp-service-account: cropguard-app-sa@cropguard-ai-509423.iam.gserviceaccount.com
