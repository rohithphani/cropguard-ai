# HTTPS load balancer: static IP + Google-managed certificate + HTTP->HTTPS redirect.
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: cropguard-cert
spec:
  domains:
    - "136-68-161-188.sslip.io"
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: cropguard-frontendconfig
spec:
  redirectToHttps:
    enabled: true
    responseCodeName: MOVED_PERMANENTLY_DEFAULT   # 301
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cropguard-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "cropguard-ip"
    networking.gke.io/managed-certificates: "cropguard-cert"
    networking.gke.io/v1beta1.FrontendConfig: "cropguard-frontendconfig"
spec:
  defaultBackend:
    service:
      name: cropguard-svc
      port: { number: 80 }
