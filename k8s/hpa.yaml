apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cropguard-hpa
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: cropguard }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 50 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120   # scale back down 2 min after load stops (default is 5)
